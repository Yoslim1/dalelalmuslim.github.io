name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [expo-offline-mobile]

permissions:
  contents: read

env:
  CI: true
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build-debug-apk:
    name: Build offline Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify offline application code
        run: |
          pnpm check
          pnpm lint
          pnpm vitest run tests/offline-content.test.ts --pool=forks --poolOptions.forks.singleFork=true
          npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dalil-almuslim-offline-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
