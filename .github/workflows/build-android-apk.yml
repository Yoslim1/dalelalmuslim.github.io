name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [expo-offline-mobile]

permissions:
  contents: read

env:
  CI: true
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-release-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify offline application code
        run: |
          pnpm check
          pnpm lint
          pnpm vitest run tests/offline-content.test.ts --pool=forks --poolOptions.forks.singleFork=true
          set +e
          npx expo-doctor 2>&1 | tee /tmp/expo-doctor.log
          doctor_status=${PIPESTATUS[0]}
          set -e
          if [ "$doctor_status" -ne 0 ]; then
            if grep -Fq "Directory check failed with unexpected server response" /tmp/expo-doctor.log && [ "$(grep -Fc '✖' /tmp/expo-doctor.log)" -eq 1 ]; then
              echo "::warning::Expo Doctor could not reach React Native Directory; all other checks completed."
            else
              exit "$doctor_status"
            fi
          fi

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Assemble standalone APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dalil-almuslim-offline-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
